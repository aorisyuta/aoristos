<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活動 — Aoristos</title>
  <meta name="description" content="Aoristos の活動の一覧。AorXC、部誌、問題の背景解説、科学の甲子園、これまでの実績。">
  <meta name="author" content="Aoristos">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    window.pageConfig = { currentPage: 'activities', basePath: '' };
  </script>
  <script src="assets/config.js"></script>
  <script src="assets/sheet.js" defer></script>
  <script src="assets/header.js" defer></script>
  <script src="assets/script.js" defer></script>
</head>
<body>

<main id="main" class="band-alt">
  <header class="page-hero">
    <div class="container">
      <h1 class="page-title">活動</h1>
      <p class="page-lead">問題を作る、解く、伝える。Aoristos の取り組みをまとめました。</p>
    </div>
  </header>

  <section class="container" style="padding-bottom:100px" aria-label="活動一覧">
    <div class="toolbar">
      <label class="search">
        <span class="skip-link">活動を検索</span>
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><path d="m13 13 5 5"/></svg>
        <input id="activitiesSearch" type="search" placeholder="キーワードで検索" autocomplete="off">
      </label>
      <div class="toolbar-meta">
        <span id="activitiesCount" aria-live="polite"></span>
      </div>
    </div>

    <div class="chips" id="filterList" role="group" aria-label="分類で絞り込む"></div>

    <div class="projects-grid" id="activitiesGrid">
      <p class="empty">読み込み中…</p>
    </div>
    <p class="empty" id="activitiesNoResults" hidden>条件に合う活動が見つかりませんでした。</p>
  </section>
</main>

</body>
</html>
